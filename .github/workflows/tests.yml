# ===========================================================================
# Roda os testes automaticamente no GitHub a cada envio de codigo.
#
# E este "check" que a protecao de branch pode exigir antes de aceitar
# mudancas na main: se algum teste falhar, o GitHub mostra um X vermelho e
# (com a regra ligada) impede a juncao.
#
# Nao precisa de nenhum segredo: os testes usam o banco em memoria (H2),
# sem Supabase e sem internet.
# ===========================================================================

name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar os testes
        run: mvn -B test
